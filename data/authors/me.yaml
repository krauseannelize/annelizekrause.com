experience:
  - role: Data Analyst Intern
    org: Researchpreneurs (Masterschool internship placement), Remote
    start: 2026-05-01
    end: 2026-07-05
    summary: |
      * I was brought in to collect new data, but noticed my team's existing data was inconsistent across file formats and was never going to answer their questions. So I built Python pipelines to scrape, clean and structure all of it, tested end to end, into a single SQL database where questions could be answered with a query.
      * Past competitor analyses had no structure I could replicate, so I defined the evaluation framework and the metrics every competitor would be scored on, then packaged it as a Claude Code skill and ran agents to apply the same criteria to every site. Any analyst after me can rerun it for an updated and unbiased report.
  - role: Career Break (Relocation & Data Analytics Retraining)
    org: Germany
    start: 2019-02-01
    end: 2026-04-30
    summary: |
      * We moved to Germany in 2018, and my remote contracting wrapped up soon after. I learned German at the local VHS (B1 integration course, 2023), then retrained in data analytics, including 30+ DataCamp courses and full-time Masterschool training from April 2025.
  - role: Operations and Data Specialist
    org: Freelance · South Africa & Germany (Remote)
    start: 2015-11-01
    end: 2019-01-31
    summary: |
      * **BigSpool Inc.:** To determine if the inventory forecasting report they bought monthly was any good, I built my own database and report to understand how it should work to make an informed call. Mine replaced the subscription completely, and I used it to manage $250K of inventory across 7 marketplaces and 5 brands.
      * **Tilburg University:** Finance professors needed 300-year-old handwritten stock ledgers turned into data for research into the 1720 South Sea Bubble. Over 2 years I analysed ~18K photographs: delivering a standardised database of ~46K East India Company transactions with ~5K unique traders identified, then overhauling their Bank of England dataset with 20K+ transfer records and 11K+ unique traders identified.
  - role: Commercial Secretary, then Services Assistant
    org: ENSafrica (Africa's largest law firm), Johannesburg & Cape Town
    start: 2012-07-01
    end: 2015-09-30
    summary: |
      * A manual monthly expense allocation tied up 5+ team members for days, so I worked out the patterns they were searching for and automated the process: exporting the expense billings from Elite 3E to Excel, filtering them and bulk-allocating the list back in Elite. The workload dropped 90% and accuracy improved.
      * Access cards were going missing across 6 offices and nobody knew how many should be in inventory, so I built a database tracking ownership and loss patterns. Now we had a full accounting and could identify repeat offenders.
      * Contract-style due-diligence reports were not bringing in business, so I redesigned them into a visually appealing product for clients and coordinated the practice groups' contributions. The new format went into the pitch that won the mandate to revise a mining conglomerate's entire contract suite in line with the new Companies Act.
  - role: Legal Secretary & Research Coordinator
    org: Various South African law firms & University of Pretoria, Gauteng
    start: 2001-09-01
    end: 2012-06-30
    summary: |
      * A senior advocate working on commission went into contract negotiations blind, so I tracked his time, calculated his commissions and reported per-client fees and rate trends. He walked into negotiations informed, and correcting past calculation mistakes put money straight back in his pocket.
      * I was handed a debt-collections department that hadn't been profitable in years, where interest ran on the *in duplum* rule: interest and costs may never exceed the outstanding capital. I studied the rule, built a spreadsheet that calculated it correctly, and defended my interpretation against senior attorneys, recovering money for clients and preventing endless debt for debtors. The department turned a profit within 6 months, and years later a court ruling confirmed my interpretation, with the rule itself codified into law.

